<a class="skip-link" href="#weather">Skip to weather</a>

<header class="app-header">
  <h1 class="brand"><svg class="icon" aria-hidden="true"><use href="#i-cloud-rain"/></svg> CLIME <span class="tagline">weather at a glance</span></h1>

  <form class="search" id="search-form" role="search" autocomplete="off">
    <label for="search-input" class="visually-hidden">Search for a place</label>
    <div class="search-field">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="text" id="search-input" name="q" placeholder="Search a place" role="combobox"
             aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
             aria-haspopup="listbox" autocomplete="off" spellcheck="false" />
      <ul id="suggestions" class="suggestions" role="listbox" aria-label="Place suggestions" hidden></ul>
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
  </form>

  <div class="places">
    <label for="location" class="visually-hidden">Pinned places</label>
    <select id="location" name="location-dropdown"></select>
    <button type="button" id="pin" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Pin</button>
    <button type="button" id="unpin" class="btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-pin-off"/></svg> Unpin</button>
    <button type="button" id="locate" class="btn btn-icon" aria-label="Use my location"><svg class="icon" aria-hidden="true"><use href="#i-locate-fixed"/></svg></button>
  </div>
</header>

<main id="weather" class="weather" tabindex="-1">
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

  <section id="loading" class="state loading" aria-label="Loading weather" hidden>
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-block"></div>
    <div class="skeleton skeleton-block"></div>
  </section>

  <section id="error" class="state error" role="alert" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-triangle-alert"/></svg>
    <p id="error-message"></p>
    <button type="button" id="retry" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-refresh-cw"/></svg> Retry</button>
  </section>

  <div id="content" hidden>
    <section class="current" aria-labelledby="loc">
      <h2 id="loc" class="place-name"></h2>
      <p class="place-time"><time id="local-time"></time> <span id="tz" class="muted"></span></p>
      <p class="hero"><span id="temperature" class="hero-temp"></span> <span id="weather-desc" class="hero-desc"></span></p>
      <dl class="facts">
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-thermometer"/></svg> Feels like</dt><dd id="apparent"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-droplets"/></svg> Humidity</dt><dd id="revh"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-wind"/></svg> Wind</dt><dd id="wind"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-umbrella"/></svg> Rain</dt><dd id="rain"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-sunrise"/></svg> Sunrise</dt><dd id="sunrise"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-sunset"/></svg> Sunset</dt><dd id="sunset"></dd></div>
        <div class="fact"><dt><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg> UV index</dt><dd><span id="uv"></span> <span id="uv-level" class="badge"></span></dd></div>
      </dl>
    </section>

    <section class="card" aria-labelledby="rain-h">
      <h2 id="rain-h">Rain, next 24 hours</h2>
      <div id="rain-chart" class="rain-chart"></div>
    </section>

    <section class="card" aria-labelledby="hourly-h">
      <h2 id="hourly-h">Hourly forecast</h2>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="hourly-h">
        <table class="hourly">
          <thead><tr><th scope="col">Time</th><th scope="col">Temp</th><th scope="col">Humidity</th><th scope="col">Wind</th><th scope="col">Rain chance</th><th scope="col">Weather</th></tr></thead>
          <tbody id="hourly-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
</body>
</html>
